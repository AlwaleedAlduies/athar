name: athar
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: athar
      POSTGRES_USER: athar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate production.env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U athar -d athar']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.production
      DEBUG: 'false'
      DEMO_MODE: 'false'
      SECRET_KEY: ${SECRET_KEY:?Generate production.env first}
      AI_CREDENTIAL_KEY: ${AI_CREDENTIAL_KEY:?Generate production.env first}
      DATABASE_URL: postgres://athar:${POSTGRES_PASSWORD}@db:5432/athar
      ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN},localhost
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      MEDIA_ROOT: /app/media
      PORT: '8000'
      LLM_PROVIDER: extractive
    volumes:
      - source_files:/app/media
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  postgres_data:
  source_files:
  caddy_data:
  caddy_config:
