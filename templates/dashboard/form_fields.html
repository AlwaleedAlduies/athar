<div class="editor-grid">{% for field in group.fields %}<div class="form-field {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}">{{ field.label_tag }}{% if field.field.required %}<span class="required-hint">مطلوب</span>{% endif %}{{ field }}{{ field.errors }}{% if field.help_text %}<small class="helptext">{{ field.help_text }}</small>{% endif %}</div>{% endfor %}</div>
