{% if editable %}<form method="get" class="paper admin-filters" role="search" aria-label="بحث في سجل المحتوى">
<div><label for="content-search">ابحث بالعنوان أو النص أو الرقم</label><input type="search" name="q" id="content-search" value="{{ query }}" placeholder="مثلًا: الهجرة أو الغار"></div>
{% if supports_status %}<div><label for="status-filter">الحالة</label><select name="status" id="status-filter"><option value="">السجل النشط</option><option value="pending" {% if request.GET.status == 'pending' %}selected{% endif %}>بانتظار المراجعة</option><option value="all" {% if request.GET.status == 'all' %}selected{% endif %}>جميع الحالات</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}
{% if supports_event %}<div><label for="event-filter">الحدث</label><select name="event" id="event-filter"><option value="">كل الأحداث</option>{% for event in events %}<option value="{{ event.pk }}" {% if request.GET.event == event.pk|stringformat:'s' %}selected{% endif %}>{{ event.title }}</option>{% endfor %}</select></div>{% endif %}
{% if request.GET.source %}<input type="hidden" name="source" value="{{ request.GET.source }}">{% endif %}{% if request.GET.claim %}<input type="hidden" name="claim" value="{{ request.GET.claim }}">{% endif %}{% if request.GET.entity %}<input type="hidden" name="entity" value="{{ request.GET.entity }}">{% endif %}{% if request.GET.source_chunk %}<input type="hidden" name="source_chunk" value="{{ request.GET.source_chunk }}">{% endif %}
<div class="actions"><button type="submit" class="button">بحث وتصفية</button><a class="text-link" href="{% url 'dashboard-list' section %}">مسح التصفية</a></div></form>{% endif %}
